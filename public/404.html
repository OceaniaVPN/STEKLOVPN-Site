<!doctype html><html lang="ru" data-season="winter"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d12"><meta name="robots" content="noindex,follow"><title>404 — STEKLOVPN</title><style>
:root{color-scheme:dark;--bg:#090d12;--text:#f3f6f8;--muted:#9aa7b7;--line:rgba(210,225,241,.14);--accent:#9bd5f2;--accent2:#c8edff;--glow:rgba(155,213,242,.18)}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:24px;overflow:hidden;color:var(--text);font:14px/1.7 Manrope,system-ui,sans-serif;background:radial-gradient(ellipse at 13% 1%,var(--glow),transparent 35%),radial-gradient(ellipse at 88% 100%,rgba(103,132,178,.14),transparent 34%),var(--bg)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:66px 66px}.card{position:relative;width:min(690px,100%);padding:clamp(28px,6vw,58px);text-align:center;overflow:hidden;border:1px solid var(--line);border-radius:29px;background:linear-gradient(145deg,#1c2531ef,#0c121bf7);box-shadow:0 28px 90px #0008}.brand{display:inline-flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.5px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;color:#0c1a22;background:linear-gradient(145deg,var(--accent2),var(--accent));box-shadow:0 0 28px var(--glow);font-size:20px;transform:rotate(-5deg)}.code{margin:30px 0 8px;font:700 clamp(82px,19vw,142px)/.88 system-ui;letter-spacing:-.09em;color:transparent;background:linear-gradient(100deg,var(--accent2),var(--accent),#a5c9ec);background-clip:text}.kicker{color:var(--accent);font-size:9px;font-weight:800;letter-spacing:2.3px;text-transform:uppercase}h1{margin:14px 0 9px;font-size:clamp(23px,5vw,34px);letter-spacing:-1px}p{max-width:490px;margin:0 auto;color:var(--muted);font-size:13px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px}a{display:inline-flex;align-items:center;justify-content:center;min-height:47px;padding:0 18px;border-radius:12px;text-decoration:none;font-size:11px;font-weight:800}.primary{color:#0c1a22;background:linear-gradient(115deg,var(--accent2),var(--accent));box-shadow:0 9px 28px var(--glow)}.secondary{color:var(--text);border:1px solid var(--line);background:#ffffff08}.spark{position:fixed;top:-12px;color:#c8edff;opacity:.6;pointer-events:none;animation:drift linear infinite}@keyframes drift{to{transform:translateY(110vh) rotate(240deg)}}@media(prefers-reduced-motion:reduce){.spark{display:none}}
</style></head><body><main class="card"><div class="brand"><span class="mark">S</span><span>STEKLO<span style="color:var(--accent)">VPN</span></span></div><div class="code">404</div><div class="kicker">Страница не найдена</div><h1>Кажется, этот маршрут потерялся</h1><p>Возможно, адрес изменился или ссылка содержит опечатку. Вернись на официальный сайт STEKLOVPN и выбери нужный раздел.</p><div class="actions"><a class="primary" href="/">На официальный сайт</a><a class="secondary" href="javascript:history.back()">Назад</a></div></main><script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<28;i++){const e=document.createElement('i');e.className='spark';e.textContent=Math.random()>.5?'✦':'·';e.style.left=Math.random()*100+'vw';e.style.fontSize=(8+Math.random()*12)+'px';e.style.animationDuration=(8+Math.random()*12)+'s';e.style.animationDelay=(-Math.random()*15)+'s';document.body.append(e)}}</script></body></html>
